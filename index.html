<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #0f172a);
            --text-color: var(--tg-theme-text-color, #f8fafc);
            --card-bg: var(--tg-theme-secondary-bg-color, #1e293b);
            --button-color: var(--tg-theme-button-color, #3b82f6);
            --button-text: var(--tg-theme-button-text-color, #ffffff);
            --accent: #f59e0b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 22px;
        }

        /* Ekranda doimiy turadigan bo'limlar (kategoriyalar) tugmasi */
        .categories {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .cat-btn {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 2px solid transparent;
            padding: 12px 8px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }

        .cat-btn.active {
            border-color: var(--button-color);
            background-color: rgba(59, 130, 246, 0.1);
        }

        /* Mahsulotlar ro'yxati konteyneri */
        .products-container {
            display: none;
            flex-direction: column;
            gap: 12px;
            animation: fadeIn 0.3s ease;
        }

        .products-container.active {
            display: flex;
        }

        .product-card {
            background-color: var(--card-bg);
            border-radius: 14px;
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .product-info h3 {
            margin: 0 0 4px 0;
            font-size: 16px;
        }

        .product-info p {
            margin: 0;
            font-size: 13px;
            color: var(--accent);
            font-weight: bold;
        }

        .buy-btn {
            background-color: var(--button-color);
            color: var(--button-text);
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .buy-btn:active {
            opacity: 0.7;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <h2>⚡ Premium Do'kon</h2>

    <!-- Ekranda doimiy turadigan bo'limlar -->
    <div class="categories">
        <button class="cat-btn active" onclick="switchTab('stars', this)">⭐ Stars</button>
        <button class="cat-btn" onclick="switchTab('premium', this)">💎 Premium</button>
        <button class="cat-btn" onclick="switchTab('gifts', this)">🎁 Sovg'alar</button>
    </div>

    <!-- Telegram Stars bo'limi (Kecha belgilangan narxlar) -->
    <div id="stars" class="products-container active">
        <div class="product-card">
            <div class="product-info">
                <h3>50 Stars</h3>
                <p>15,000 UZS</p>
            </div>
            <button class="buy-btn" onclick="buyItem('50 Telegram Stars')">Sotib olish</button>
        </div>
        <div class="product-card">
            <div class="product-info">
                <h3>100 Stars</h3>
                <p>28,000 UZS</p>
            </div>
            <button class="buy-btn" onclick="buyItem('100 Telegram Stars')">Sotib olish</button>
        </div>
        <div class="product-card">
            <div class="product-info">
                <h3>500 Stars</h3>
                <p>135,000 UZS</p>
            </div>
            <button class="buy-btn" onclick="buyItem('500 Telegram Stars')">Sotib olish</button>
        </div>
    </div>

    <!-- Telegram Premium bo'limi -->
    <div id="premium" class="products-container">
        <div class="product-card">
            <div class="product-info">
                <h3>1 Oylik Premium</h3>
                <p>25,000 UZS</p>
            </div>
            <button class="buy-btn" onclick="buyItem('1 Oylik Telegram Premium')">Sotib olish</button>
        </div>
        <div class="product-card">
            <div class="product-info">
                <h3>1 Yillik Premium</h3>
                <p>210,000 UZS</p>
            </div>
            <button class="buy-btn" onclick="buyItem('1 Yillik Telegram Premium')">Sotib olish</button>
        </div>
    </div>

    <!-- Sovg'alar (Gifts) bo'limi -->
    <div id="gifts" class="products-container">
        <div class="product-card">
            <div class="product-info">
                <h3>Maxsus Rojdestvo Tulki 🦊</h3>
                <p>50,000 UZS</p>
            </div>
            <button class="buy-btn" onclick="buyItem('Sovg`a: Rojdestvo Tulki')">Sotib olish</button>
        </div>
        <div class="product-card">
            <div class="product-info">
                <h3>Oltin kubok 🏆</h3>
                <p>90,000 UZS</p>
            </div>
            <button class="buy-btn" onclick="buyItem('Sovg`a: Oltin kubok')">Sotib olish</button>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        function switchTab(tabId, btnElement) {
            document.querySelectorAll('.products-container').forEach(el => {
                el.classList.remove('active');
            });
            document.querySelectorAll('.cat-btn').forEach(el => {
                el.classList.remove('active');
            });
            document.getElementById(tabId).classList.add('active');
            btnElement.classList.add('active');
        }

        function buyItem(itemName) {
            tg.sendData(itemName);
        }
    </script>
</body>
</html>
